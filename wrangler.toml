name = "noticiero-void"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Static SPA served from ./public. API routes (/api/*) run the Worker first.
[assets]
directory = "./public"
binding = "ASSETS"
# Unknown paths reach the Worker, which renders the page (or a real 404) server-side.
not_found_handling = "none"
run_worker_first = ["/api/*", "/", "/index.html"]

[observability]
enabled = true

# Every minute: whale-alert scanner (news ingestion on the quarter hour).
# Every 6 hours: FRED cache warm-up, calendar persistence and AI briefing.
[triggers]
crons = ["* * * * *", "5 */6 * * *"]

[vars]
AI_MODEL = "claude-opus-5-5"
AI_EFFORT = "medium"
# Canonical origin for URLs, sitemaps and structured data (change when a custom domain is added).
SITE_URL = "https://noticierovoid.com"
# Search engine ownership verification tokens (the content="" value of their meta tag).
GOOGLE_SITE_VERIFICATION = ""
BING_SITE_VERIFICATION = ""
# Coinzilla: paste your zone IDs (the part after "C-") and the site-verification code.
COINZILLA_ZONE_LEADERBOARD = ""
COINZILLA_ZONE_RECTANGLE = ""
COINZILLA_ZONE_MOBILE = ""
COINZILLA_STICKY_ZONE = ""
COINZILLA_VERIFICATION = ""

# Workers AI (free daily allocation): writes the VOID Report stories; capped in src/services/story.js.
[ai]
binding = "AI"

# ---- Optional bindings (uncomment after creating them; see README) ----------------
# KV cache: npx wrangler kv namespace create CACHE
# [[kv_namespaces]]
# binding = "CACHE"
# id = "<your-kv-namespace-id>"

# D1: news archive, whale alerts, watched wallets, calendar change tracking.
[[d1_databases]]
binding = "DB"
database_name = "noticiero-void"
database_id = "63247ebf-d584-42e6-ba59-62a8c55d094f"
migrations_dir = "migrations"

# Global rate limit for AI endpoints (Workers Rate Limiting API)
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
#   [ratelimits.simple]
#   limit = 10
#   period = 60

# Secrets (never put these in this file):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put FRED_API_KEY        (optional: enables release calendar)
#   npx wrangler secret put COINGECKO_API_KEY   (optional)
#   npx wrangler secret put ADMIN_TOKEN         (protects POST /api/admin/ingest)
